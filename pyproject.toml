[project]
name = "vision-tool"
version = "0.1.1"
description = "Consulta um modelo de visão (texto+imagem -> texto) em uma única execução via llama-mtmd-cli"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
]

[project.scripts]
vision-tool = "vision_tool.cli:main"
vision = "vision_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vision_tool"]
